name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "task/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:8082,http://localhost:8082,http://127.0.0.1:5173,http://localhost:5173
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vse_pro_zhar_test
      EXPO_PUBLIC_API_URL: http://127.0.0.1:3000
      VITE_API_URL: http://127.0.0.1:3000
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: vse_pro_zhar_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vse_pro_zhar_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 24.14.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Apply database migrations
        run: pnpm --filter @vse-pro-zhar/database migrate

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Foundation browser smoke
        run: pnpm e2e
